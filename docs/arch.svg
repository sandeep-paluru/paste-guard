<svg xmlns="http://www.w3.org/2000/svg" width="760" height="300" viewBox="0 0 760 300" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4a5568"/></marker></defs>
<rect x="10" y="20" width="300" height="260" rx="10" fill="#eef4ff" stroke="#2b6cb0"/>
<text x="160" y="45" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a365d">Chrome extension (MV3)</text>
<text x="160" y="63" text-anchor="middle" font-size="11" fill="#4a5568">claude.ai, chatgpt.com, chat.openai.com</text>
<rect x="30" y="78" width="260" height="58" rx="6" fill="#fff" stroke="#90cdf4"/>
<text x="160" y="100" text-anchor="middle" font-size="12.5">Content script intercepts</text>
<text x="160" y="118" text-anchor="middle" font-size="12.5">paste, file upload, drag-and-drop</text>
<rect x="30" y="146" width="260" height="40" rx="6" fill="#fff" stroke="#90cdf4"/>
<text x="160" y="171" text-anchor="middle" font-size="12.5">Service worker sends to backend</text>
<rect x="30" y="196" width="260" height="70" rx="6" fill="#fff" stroke="#90cdf4"/>
<text x="160" y="218" text-anchor="middle" font-size="12.5">Overlay: allow, nudge, coach, block</text>
<text x="160" y="236" text-anchor="middle" font-size="12.5">matched document and passage</text>
<text x="160" y="254" text-anchor="middle" font-size="12.5">one-click redaction, cancel</text>
<rect x="420" y="20" width="330" height="260" rx="10" fill="#f0fff4" stroke="#2f855a"/>
<text x="585" y="45" text-anchor="middle" font-size="15" font-weight="bold" fill="#22543d">FastAPI backend</text>
<text x="585" y="63" text-anchor="middle" font-size="11" fill="#4a5568">local machine, or the 1 GB Oracle VM for the demo</text>
<text x="440" y="90" font-size="12.5">1. Secrets and marker scan</text>
<text x="440" y="112" font-size="12.5">2. Windows embedded with all-MiniLM-L6-v2</text>
<text x="440" y="134" font-size="12.5">3. Nearest passages in sqlite-vec</text>
<text x="440" y="156" font-size="12.5">4. Word 3-gram containment</text>
<text x="440" y="178" font-size="12.5">5. TF-IDF cosine (accurate profile)</text>
<text x="440" y="200" font-size="12.5">6. Threshold bands to a verdict</text>
<rect x="440" y="216" width="290" height="50" rx="6" fill="#fff" stroke="#9ae6b4"/>
<text x="585" y="237" text-anchor="middle" font-size="12">Audit log: SHA-256 hash, length,</text>
<text x="585" y="254" text-anchor="middle" font-size="12">verdict, source name, site. No content.</text>
<line x1="292" y1="166" x2="418" y2="150" stroke="#4a5568" stroke-width="1.6" marker-end="url(#a)"/>
<text x="355" y="132" text-anchor="middle" font-size="11" fill="#4a5568">/check</text>
<text x="355" y="145" text-anchor="middle" font-size="11" fill="#4a5568">/check_file</text>
<line x1="418" y1="205" x2="292" y2="222" stroke="#4a5568" stroke-width="1.6" marker-end="url(#a)"/>
<text x="355" y="240" text-anchor="middle" font-size="11" fill="#4a5568">verdict,</text>
<text x="355" y="254" text-anchor="middle" font-size="11" fill="#4a5568">matches, redaction</text>
</svg>
