# Paste Guard configuration. Paths are relative to this file.
# After changing [index] paths, run:  ./pasteguard reindex

# Matching profile. "default" = MiniLM OR 3-gram (fits the 1 GB VM).
# "accurate" = MiniLM OR 3-gram OR TF-IDF (best held-out accuracy among configs with full-check p95 under 100 ms).
# Switch here or with PG_PROFILE=accurate. See eval/benchmarks.md.
profile = "default"

[index]
# Folders with confidential documents (.md .txt .pdf .docx)
docs = ["demo/company-docs"]
# Folders with source code repositories
code = ["demo/company-repo"]
# Index file (local SQLite with vectors)
db = "data/index.db"

[server]
host = "127.0.0.1"
port = 8765

# Cosine similarity thresholds per content kind (0 to 1).
# Values are tuned with eval/run_eval.py; see eval/results.md.
# Bands are deliberately separated: nudge is a soft heads-up, coach the best-F1 point,
# block sits above every negative seen in the eval.
[thresholds.doc]
nudge = 0.58
coach = 0.64
block = 0.74

[thresholds.code]
nudge = 0.55
coach = 0.65
block = 0.85

# Hybrid matching: share of the pasted window's word 3-grams found in one indexed passage.
# Catches partial excerpts and verbatim reuse that the embedding blurs. No nudge level.
[fingerprint]
min_shingles = 8

[fingerprint.doc]
coach = 0.25
block = 0.5

[fingerprint.code]
coach = 0.25
block = 0.5

[sites]
# AI sites the browser extension protects
allowed = ["claude.ai", "chatgpt.com", "chat.openai.com"]

[audit]
# Verdict log for the /admin page. Stores hashes, lengths and verdicts only, never content.
db = "data/audit.db"
keep_days = 30

[profiles.accurate]
# Same model and index as default (no reindex needed); adds a TF-IDF cosine check (word 1-2 grams) for documents.
# Thresholds from eval/bench_report.py (3-way OR, best F1 with false alarms at most 3%).
# TF-IDF is off for code (coach above 1): on code it added false alarms without adding recall.
[profiles.accurate.tfidf]
enabled = true
doc = { coach = 0.23, block = 0.45 }
code = { coach = 1.01, block = 1.01 }
