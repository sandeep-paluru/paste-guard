name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: tests/js/package-lock.json

      - name: Install Python dependencies
        run: pip install -r backend/requirements.txt pytest httpx

      - name: Install JS test dependencies
        working-directory: tests/js
        run: npm ci

      # fastembed stores the MiniLM ONNX weights here (Hugging Face hub layout).
      - name: Cache embedding model
        uses: actions/cache@v6
        with:
          path: ~/.cache/paste-guard/models
          key: minilm-l6-v2-${{ hashFiles('backend/requirements.txt', 'backend/embedder.py') }}
          restore-keys: |
            minilm-l6-v2-

      - name: Fetch sample code repository
        run: |
          git clone https://github.com/pallets/itsdangerous demo/company-repo
          git -C demo/company-repo checkout 672971d66a2ef9f85151e53283113f33d642dabd

      - name: Build the index
        working-directory: backend
        run: python index.py reindex

      - name: Run tests
        run: python -m pytest
