[pytest]
# Only the project's own tests. demo/company-repo is the sample "company code" being protected
# and carries its own test suite, which is not part of Paste Guard.
testpaths = tests
norecursedirs = demo .venv data node_modules .git
addopts = -q
filterwarnings =
    ignore::DeprecationWarning
    ignore:Using `httpx`
